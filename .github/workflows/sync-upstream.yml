# 每天把 MrChartist/global-stock-logos 的更新同步到本 fork。
# 只做同步，不抓取任何数据。上游自带的 daily-sync / monthly-refresh / ci
# 三个工作流请在 Actions 页面手动 Disable，避免本 fork 自己去批量抓取。
name: Sync upstream

on:
  schedule:
    # 上游在 UTC 02:00 开始抓取，最长约 90 分钟；这里错开到 UTC 05:17（北京时间 13:17）
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Merge upstream into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          out=$(gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=main 2>&1) || {
            echo "$out"
            echo "::error::同步失败。若提示与 workflow 权限有关，说明上游改动了工作流文件，请在仓库页面点 Sync fork 手动同步一次。"
            exit 1
          }
          echo "$out"
